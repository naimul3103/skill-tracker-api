<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 12; stroke: #30363d; stroke-width: 1.5; }
    .header-txt { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
    .node { fill: #161b22; stroke: #58a6ff; stroke-width: 1.8; rx: 8; }
    .decision { fill: #161b22; stroke: #d2a8ff; stroke-width: 1.8; }
    .err-node { fill: #211215; stroke: #f85149; stroke-width: 1.8; rx: 6; }
    .ok-node { fill: #122117; stroke: #3fb950; stroke-width: 1.8; rx: 6; }
    .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; font-weight: bold; }
    .sub { fill: #8b949e; font-family: monospace; font-size: 10px; }
    .err-txt { fill: #ff7b72; font-family: monospace; font-size: 10.5px; font-weight: bold; }
    .ok-txt { fill: #56d364; font-family: monospace; font-size: 10.5px; font-weight: bold; }
    .lbl-no { fill: #ff7b72; font-family: monospace; font-size: 10px; font-weight: bold; }
    .lbl-yes { fill: #56d364; font-family: monospace; font-size: 10px; font-weight: bold; }
    .flow-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; stroke-dasharray: 5; animation: dash 1.5s linear infinite; }
    .flow-red { stroke: #f85149; stroke-width: 1.8; fill: none; stroke-dasharray: 5; animation: dash 1.5s linear infinite; }
    .flow-green { stroke: #3fb950; stroke-width: 1.8; fill: none; stroke-dasharray: 5; animation: dash 1.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -10; } }
  </style>

  <rect width="720" height="360" class="bg" />
  <text x="360" y="24" text-anchor="middle" class="header-txt">INTEGRITY DECISION TREE</text>

  <!-- ================= LEFT BRANCH: DELETE SKILL (RESTRICT) ================= -->
  <rect x="65" y="42" width="230" height="36" class="node" />
  <text x="180" y="64" text-anchor="middle" class="title">DELETE /skills/{skill_id}</text>

  <!-- Line to Decision 1 -->
  <line x1="180" y1="78" x2="180" y2="102" class="flow-blue" />

  <!-- Decision 1: Skill Exists? -->
  <polygon points="180,102 265,134 180,166 95,134" class="decision" />
  <text x="180" y="131" text-anchor="middle" class="title">Skill Exists?</text>
  <text x="180" y="144" text-anchor="middle" class="sub">db.get(Skill, id)</text>

  <!-- No -> 404 -->
  <line x1="95" y1="134" x2="55" y2="134" class="flow-red" />
  <line x1="55" y1="134" x2="55" y2="178" class="flow-red" />
  <text x="75" y="127" text-anchor="middle" class="lbl-no">NO</text>
  <rect x="15" y="178" width="80" height="38" class="err-node" />
  <text x="55" y="195" text-anchor="middle" class="err-txt">404</text>
  <text x="55" y="208" text-anchor="middle" class="sub">Not Found</text>

  <!-- Yes -> Decision 2 -->
  <line x1="180" y1="166" x2="180" y2="195" class="flow-green" />
  <text x="195" y="183" class="lbl-yes">YES</text>

  <!-- Decision 2: Linked Journals == 0? -->
  <polygon points="180,195 275,230 180,265 85,230" class="decision" />
  <text x="180" y="227" text-anchor="middle" class="title">Journals == 0?</text>
  <text x="180" y="240" text-anchor="middle" class="sub">RESTRICT count()</text>

  <!-- No -> 400 Bad Request -->
  <line x1="85" y1="230" x2="55" y2="230" class="flow-red" />
  <line x1="55" y1="230" x2="55" y2="292" class="flow-red" />
  <text x="70" y="223" text-anchor="middle" class="lbl-no">NO</text>
  <rect x="15" y="292" width="115" height="44" class="err-node" />
  <text x="72" y="311" text-anchor="middle" class="err-txt">400 Bad Request</text>
  <text x="72" y="325" text-anchor="middle" class="sub">RESTRICT Blocked</text>

  <!-- Yes -> 204 Deleted -->
  <line x1="220" y1="250" x2="255" y2="292" class="flow-green" />
  <text x="248" y="272" class="lbl-yes">YES</text>
  <rect x="185" y="292" width="135" height="44" class="ok-node" />
  <text x="252" y="311" text-anchor="middle" class="ok-txt">204 No Content</text>
  <text x="252" y="325" text-anchor="middle" class="sub">Skill Deleted</text>

  <!-- Center Divider -->
  <line x1="360" y1="42" x2="360" y2="340" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ================= RIGHT BRANCH: JOURNAL WRITE VALIDATION ================= -->
  <rect x="425" y="42" width="230" height="36" class="node" />
  <text x="540" y="64" text-anchor="middle" class="title">POST / PUT /journals</text>

  <!-- Line to Decision 1 -->
  <line x1="540" y1="78" x2="540" y2="102" class="flow-blue" />

  <!-- Decision 1: Pydantic Valid? -->
  <polygon points="540,102 630,134 540,166 450,134" class="decision" />
  <text x="540" y="131" text-anchor="middle" class="title">Pydantic Valid?</text>
  <text x="540" y="144" text-anchor="middle" class="sub">types &amp; length</text>

  <!-- No -> 422 -->
  <line x1="630" y1="134" x2="665" y2="134" class="flow-red" />
  <line x1="665" y1="134" x2="665" y2="178" class="flow-red" />
  <text x="647" y="127" text-anchor="middle" class="lbl-no">NO</text>
  <rect x="620" y="178" width="85" height="38" class="err-node" />
  <text x="662" y="195" text-anchor="middle" class="err-txt">422 Error</text>
  <text x="662" y="208" text-anchor="middle" class="sub">Schema Fail</text>

  <!-- Yes -> Decision 2 -->
  <line x1="540" y1="166" x2="540" y2="195" class="flow-green" />
  <text x="555" y="183" class="lbl-yes">YES</text>

  <!-- Decision 2: skill_id Valid or Null? -->
  <polygon points="540,195 635,230 540,265 445,230" class="decision" />
  <text x="540" y="227" text-anchor="middle" class="title">skill_id Valid?</text>
  <text x="540" y="240" text-anchor="middle" class="sub">Null or FK Exists</text>

  <!-- No -> 400 Bad Request -->
  <line x1="635" y1="230" x2="665" y2="230" class="flow-red" />
  <line x1="665" y1="230" x2="665" y2="292" class="flow-red" />
  <text x="650" y="223" text-anchor="middle" class="lbl-no">NO</text>
  <rect x="590" y="292" width="115" height="44" class="err-node" />
  <text x="647" y="311" text-anchor="middle" class="err-txt">400 Bad Request</text>
  <text x="647" y="325" text-anchor="middle" class="sub">Invalid skill_id</text>

  <!-- Yes -> 201 / 200 OK -->
  <line x1="500" y1="250" x2="465" y2="292" class="flow-green" />
  <text x="462" y="272" class="lbl-yes">YES</text>
  <rect x="400" y="292" width="135" height="44" class="ok-node" />
  <text x="467" y="311" text-anchor="middle" class="ok-txt">201 / 200 OK</text>
  <text x="467" y="325" text-anchor="middle" class="sub">Entry Committed</text>
</svg>