<svg width="720" height="310" viewBox="0 0 720 310" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 12; stroke: #30363d; stroke-width: 1.5; }
    .terminal-bar { fill: #161b22; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
    .header-txt { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: bold; }
    .tree-line { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .dir { fill: #58a6ff; font-family: monospace; font-size: 13px; font-weight: bold; }
    .file { fill: #e6edf3; font-family: monospace; font-size: 12.5px; }
    .db-file { fill: #ffa657; font-family: monospace; font-size: 12.5px; }
    .comment { fill: #8b949e; font-family: monospace; font-size: 11.5px; }
    .row { opacity: 0; animation: fadeInRow 0.5s ease-out forwards; }
    .r1 { animation-delay: 0.1s; }
    .r2 { animation-delay: 0.25s; }
    .r3 { animation-delay: 0.4s; }
    .r4 { animation-delay: 0.55s; }
    .r5 { animation-delay: 0.7s; }
    .r6 { animation-delay: 0.85s; }
    .r7 { animation-delay: 1.0s; }
    .r8 { animation-delay: 1.15s; }
    .r9 { animation-delay: 1.3s; }
    @keyframes fadeInRow {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .cursor { fill: #3fb950; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="720" height="310" class="bg" />
  <path d="M 1 12 Q 1 1 12 1 L 708 1 Q 719 1 719 12 L 719 34 L 1 34 Z" class="terminal-bar" />
  <circle cx="20" cy="18" r="5" class="dot-r" />
  <circle cx="38" cy="18" r="5" class="dot-y" />
  <circle cx="56" cy="18" r="5" class="dot-g" />
  <text x="360" y="22" text-anchor="middle" class="header-txt">PROJECT SKELETON &amp; SEPARATION OF CONCERNS</text>

  <!-- Root -->
  <g class="row r1">
    <text x="28" y="62" class="dir">📁 skill-tracker-api/</text>
    <rect x="195" y="51" width="7" height="13" class="cursor" />
  </g>

  <!-- Tree Vertical Spine -->
  <line x1="38" y1="70" x2="38" y2="225" class="tree-line" />

  <!-- main.py -->
  <g class="row r2">
    <line x1="38" y1="86" x2="56" y2="86" class="tree-line" />
    <text x="64" y="90" class="file">🐍 main.py</text>
    <text x="275" y="90" class="comment"># App initialization, lifespan &amp; router registration</text>
  </g>

  <!-- database.py -->
  <g class="row r3">
    <line x1="38" y1="112" x2="56" y2="112" class="tree-line" />
    <text x="64" y="116" class="file">⚙️ database.py</text>
    <text x="275" y="116" class="comment"># SQLAlchemy engine, SessionLocal &amp; get_db() yield</text>
  </g>

  <!-- models.py -->
  <g class="row r4">
    <line x1="38" y1="138" x2="56" y2="138" class="tree-line" />
    <text x="64" y="142" class="file">🗄️ models.py</text>
    <text x="275" y="142" class="comment"># Declarative ORM models (Skill, Journal tables)</text>
  </g>

  <!-- schemas.py -->
  <g class="row r5">
    <line x1="38" y1="164" x2="56" y2="164" class="tree-line" />
    <text x="64" y="168" class="file">🛡️ schemas.py</text>
    <text x="275" y="168" class="comment"># Pydantic v2 validation &amp; nested response contracts</text>
  </g>

  <!-- skill_tracker.db -->
  <g class="row r6">
    <line x1="38" y1="190" x2="56" y2="190" class="tree-line" />
    <text x="64" y="194" class="db-file">💾 skill_tracker.db</text>
    <text x="275" y="194" class="comment"># Auto-generated SQLite storage (.gitignore tracked)</text>
  </g>

  <!-- routers/ -->
  <g class="row r7">
    <line x1="38" y1="220" x2="56" y2="220" class="tree-line" />
    <text x="64" y="224" class="dir">📂 routers/</text>
  </g>

  <!-- Sub-tree Spine -->
  <line x1="74" y1="232" x2="74" y2="288" class="tree-line" />

  <!-- __init__.py -->
  <g class="row r7">
    <line x1="74" y1="244" x2="92" y2="244" class="tree-line" />
    <text x="100" y="248" class="file">📄 __init__.py</text>
    <text x="275" y="248" class="comment"># Router sub-package initializer</text>
  </g>

  <!-- skills.py -->
  <g class="row r8">
    <line x1="74" y1="266" x2="92" y2="266" class="tree-line" />
    <text x="100" y="270" class="file">🚀 skills.py</text>
    <text x="275" y="270" class="comment"># /skills CRUD &amp; O(1) RESTRICT deletion guard</text>
  </g>

  <!-- journals.py -->
  <g class="row r9">
    <line x1="74" y1="288" x2="92" y2="288" class="tree-line" />
    <text x="100" y="292" class="file">📓 journals.py</text>
    <text x="275" y="292" class="comment"># /journals CRUD &amp; foreign-key skill_id checks</text>
  </g>
</svg>